name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the Actions tab

# Permissions required to create a Release and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history and tags

      # Step 2: Set up Java environment (required for Android Gradle builds)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Fetch Dart/Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 4.5: Install fixed debug keystore from secret
      - name: Install debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > ~/.android/debug.keystore
          echo "Keystore written: $(wc -c < ~/.android/debug.keystore) bytes"
          if [ ! -s ~/.android/debug.keystore ]; then
            echo "ERROR: Keystore file is empty or does not exist. Check if DEBUG_KEYSTORE_BASE64 secret is configured correctly."
            exit 1
          fi

      # Step 5: Build the release APK
      - name: Build APK
        run: flutter build apk --release

      # Step 6: Extract version from pubspec.yaml
      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Step 7: Check if a GitHub Release for this version already exists
      - name: Check if release exists
        id: check_release
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version v${{ steps.get_version.outputs.version }} already released."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version v${{ steps.get_version.outputs.version }} is new. Creating release."
          fi

      # Step 8: Automatically create GitHub Release and upload APK if version is bumped
      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body: |
            Automated release for Zyp Music version ${{ steps.get_version.outputs.version }}.
            
            This release contains the compiled APK signed with the debug key.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 9: Always upload APK as workflow artifact (backup)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyp-music-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
