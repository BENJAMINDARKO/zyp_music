name: Auto-Merge Genre Suggestions

on:
  repository_dispatch:
    types: [approve_suggestion]

jobs:
  merge:
    if: github.event.client_payload.status == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_URL: "https://wltbtvzmljsdoqvlthyw.supabase.co"
      SUPABASE_ANON_KEY: "sb_publishable_VeUpNYJHUsSwVxmJfCx4AQ_bpQ9r_B_"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Merge Script
        env:
          ARTIST_NAME: ${{ github.event.client_payload.artist_name }}
          SUGGESTED_GENRES: ${{ toJson(github.event.client_payload.suggested_genres) }}
          TARGET_TYPE: ${{ github.event.client_payload.target_type }}
        run: |
          python -c "
          import os, json, sys

          artist_name = os.environ.get('ARTIST_NAME', '').strip()
          target_type = os.environ.get('TARGET_TYPE', 'track')
          genres_raw = os.environ.get('SUGGESTED_GENRES', '[]')

          try:
              suggested_genres = json.loads(genres_raw)
          except Exception as e:
              print(f'Failed to parse genres JSON: {e}')
              sys.exit(1)

          if not artist_name or not suggested_genres:
              print('Invalid or empty payload data. Skipping.')
              sys.exit(0)

          file_path = 'assets/data/genre_normalization.json'

          try:
              with open(file_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except Exception as e:
              print(f'Error reading normalization file: {e}')
              sys.exit(1)

          data[artist_name.lower()] = suggested_genres[0]
          sorted_data = dict(sorted(data.items()))

          try:
              with open(file_path, 'w', encoding='utf-8') as f:
                  json.dump(sorted_data, f, indent=2, ensure_ascii=False)
              print(f'Successfully updated matrix: {artist_name.lower()} -> {suggested_genres[0]}')
          except Exception as e:
              print(f'Failed to write file: {e}')
              sys.exit(1)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Auto-DJ Bot"
          git config --global user.email "bot@zypmusic.com"
          git add assets/data/genre_normalization.json
          git commit -m "chore(auto-dj): merge approved artist tag correction [skip ci]" || exit 0
          git push origin main

      - name: Purge jsDelivr CDN Cache
        run: |
          curl -s https://purge.jsdelivr.net/gh/BENJAMINDARKO/zyp_music@main/assets/data/genre_normalization.json
          echo "CDN cache cleared."
