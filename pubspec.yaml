name: ytmusix
description: YouTube Music Streamer — audio from public YouTube playlists.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.4.1
  path: ^1.9.1
  youtube_explode_dart: ^3.1.0
  just_audio: ^0.9.43
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
