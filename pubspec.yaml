name: zyp_music
description: ZYPMusic - Native Audio Streamer
publish_to: 'none'
version: 1.2.9+17

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.1
  path: ^1.9.1
  youtube_explode_dart: ^3.1.0
  just_audio: ^0.9.43
  provider: ^6.1.2
  audio_session: ^0.1.25
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.12.0
  audio_service: ^0.18.18
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.0.0
  package_info_plus: ^8.0.0
  audio_waveforms: ^2.0.2
  mini_music_visualizer: ^1.1.4
  url_launcher: ^6.3.2
  palette_generator: ^0.3.3+7
  scrollable_positioned_list: ^0.3.8
  dart_ytmusic_api: ^1.3.6
  permission_handler: ^12.0.3
  audio_video_progress_bar: ^2.0.3
  share_plus: ^12.0.2
  connectivity_plus: ^6.0.0
  phosphoricons_flutter: ^1.0.0
  flutter_svg: ^2.0.10+1
  rxdart: ^0.28.0
  audiotags: ^1.4.5
  filesystem_picker: ^4.1.0
  html: ^0.15.6
  android_intent_plus: ^6.0.0
  ota_update: ^7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  rename: ^3.1.0
  sqflite_common_ffi: ^2.3.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/icon.png

flutter_native_splash:
  color: "#121212"
  image: tool/icon.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/data/genre_normalization.json
    - assets/data/genre_proximity_matrix.json
    - assets/data/country_to_region.json
    - assets/icons/

dependency_overrides:
  just_audio:
    path: packages/just_audio
