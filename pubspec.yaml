name: ytmusix
description: YouTube Music Streamer — audio from public YouTube playlists.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.4.1
  path: ^1.9.1
  youtube_explode_dart: ^3.1.0
  just_audio: ^0.9.43
  provider: ^6.1.2
  audio_session: ^0.1.25
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/icon.png

flutter_native_splash:
  color: "#121212"
  image: tool/icon.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

flutter:
  uses-material-design: true
